<!DOCTYPE html>
<!--restaurant_detail.html-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Details</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    /* CSS styles */
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
    body{background-color:#f5f5f5}
    .header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background-color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.1)}
    .back-button{text-decoration:none;color:#333;display:flex;align-items:center}
    .share-button{background:none;border:none;color:#333;cursor:pointer}
    .hero-image{width:100%;height:250px;object-fit:cover}
    .restaurant-info{background-color:#fff;border-radius:15px;margin:-20px 15px 0;padding:20px;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.1)}
    .restaurant-name{font-size:24px;font-weight:700;margin-bottom:5px}
    .restaurant-categories{color:#666;margin-bottom:15px}
    .restaurant-rating{position:absolute;top:20px;right:20px;background-color:#fef2e4;color:#ff8c00;padding:5px 10px;border-radius:15px;font-weight:700}
    .restaurant-hours-price{display:flex;align-items:center;color:#666;margin-bottom:15px}
    .price-level{margin-left:15px;color:#666}
    .action-buttons{display:flex;margin:15px -5px}
    .action-button{flex:1;margin:0 5px;padding:12px;border:none;border-radius:8px;background-color:#ff7043;color:#fff;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center}
    .action-button i{margin-right:8px}
    .section-title{font-size:18px;font-weight:700;margin:25px 15px 15px}
    .dishes-container{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;padding:0 15px;scrollbar-width:none}
    .dishes-container::-webkit-scrollbar{display:none}
    .dish-card{min-width:280px;margin-right:15px;background-color:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.1)}
    .dish-image{width:100%;height:180px;object-fit:cover}
    .dish-info{padding:12px}
    .dish-name{font-weight:700;margin-bottom:5px}
    .dish-price{color:#666}
    .location-hours{margin:0 15px 25px;background-color:#fff;border-radius:10px;padding:15px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
    .location-address,.hours-row{display:flex;align-items:center;margin-bottom:10px;color:#666}
    .location-address i,.hours-row i{color:#ff7043;margin-right:10px;width:20px}
    .hours-details{margin-left:30px}
    .heart-button{position:absolute;top:15px;right:15px;background:#fff;border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.2);cursor:pointer}
    .heart-icon{color:#ff7043;font-size:20px}
    .popular-dish-card{flex:1 1 280px;background-color:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.1);padding:15px;cursor:pointer;text-align:center;margin:auto}
    .popular-dish-name{margin:0 0 5px;font-size:18px;font-weight:700}
    .popular-dish-description{margin:0 0 5px;font-size:14px;color:#666}
    .popular-dish-price{margin:0;color:#ff7043;font-weight:700}
    @media(max-width:768px){.popular-dish-card{flex:1 1 90%}}
  </style>
</head>
<body>
  <!-- Header with back and share buttons -->
  <div class="header">
    <a href="#" class="back-button" id="backLink">
      <i class="fas fa-arrow-left"></i>
      <span style="margin-left:8px;">Restaurant Detail</span>
    </a>
    <button class="share-button">
      <i class="fas fa-share-alt"></i>
    </button>
  </div>
  
  <!-- Hero image with heart button -->
  <div style="position: relative;">
    <img id="heroImg" src="../image/cat.png" alt="Restaurant Image" class="hero-image">
    <button class="heart-button">
      <i class="far fa-heart heart-icon"></i>
    </button>
  </div>
  
  <!-- Restaurant information -->
  <div class="restaurant-info">
    <h1 class="restaurant-name">Loading...</h1>
    <div class="restaurant-categories">
      <span>Loading...</span>
    </div>
    <div class="restaurant-rating">
      <i class="fas fa-star" style="color: #ff8c00;"></i>
      <span>Loading...</span>
    </div>
    <div class="restaurant-hours-price">
      <span><i class="far fa-clock" style="margin-right:5px;"></i>Loading...</span>
      <span class="price-level">Loading...</span>
    </div>
  </div>
  
  <!-- Popular dishes section -->
  <h2 class="section-title">Popular Dishes</h2>
  <div class="dishes-container" id="dishes-container">
    <!-- Popular dishes will be loaded here -->
  </div>

  <!-- Location and hours section -->
  <h2 class="section-title">Location & Hours</h2>
  <div class="location-hours">
    <div class="location-address">
      <i class="fas fa-map-marker-alt"></i>
      <span>Loading...</span>
    </div>
    <div class="hours-row">
      <i class="far fa-clock"></i>
      <div>
        <div>Loading...</div>
        <div class="hours-details">Loading...</div>
        <div class="hours-details">Loading...</div>
      </div>
    </div>
  </div>
  
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    let roomID = urlParams.get("roomID");
    
    // ถ้าค่า roomID เป็น null หรือ "null" ให้เคลียร์
    if (!roomID || roomID === "null") {
      roomID = "";
    }
    // ตั้งค่า href ของปุ่ม backLink
    const backLink = document.getElementById("backLink");
    if (roomID) {
      backLink.href = `aiResuilt.html?roomID=${roomID}`;
    } else {
      backLink.href = "aiResuilt.html";
    }
    console.log("RoomID:", roomID);
    console.log("Back link set to:", backLink.href);
  });

  async function loadRestaurantDetails() {
    const urlParams = new URLSearchParams(window.location.search);
    const restaurantID = urlParams.get('restaurantID');
    if (!restaurantID) {
      alert('Missing restaurantID');
      return;
    }

    try {
      const response = await fetch(`${API_BASE_URL}/getRestaurantDetails.php?restaurantID=${restaurantID}`);
      const data = await response.json();
      console.log("Restaurant details:", data);

      if (data.status === 'success' && data.restaurant.imageBase64) {
        const imageData = "data:image/jpeg;base64," + data.restaurant.imageBase64;
        document.getElementById('heroImg').src = imageData;
      } else {
        console.error("No image data found", data);
      }

      document.querySelector('.restaurant-name').textContent = data.restaurant.RestaurantName;
      document.querySelector('.restaurant-rating span').textContent = data.restaurant.AverageRating || "N/A";
      document.querySelector('.restaurant-categories span').textContent = data.restaurant.CuisineType || "N/A";
      document.querySelector('.location-address span').textContent = data.restaurant.Address || "N/A";
      
      // โหลด Popular Dishes
      loadPopularDishes(restaurantID);
      // โหลดรายการเมนู
      loadMenuItems(restaurantID);
    } catch (error) {
      console.error("Error loading restaurant details:", error);
    }
  }

  async function loadPopularDishes(restaurantID) {
    try {
      const url = `${API_BASE_URL}/getMenuItems.php?restaurantID=${restaurantID}`;
      console.log("Fetching URL:", url);
      const response = await fetch(url);
      const data = await response.json();
      console.log("Popular dishes:", data);

      const dishesContainer = document.getElementById('dishes-container');
      if (data.status === 'success' && data.menuItems.length > 0) {
        const popularDishes = data.menuItems.slice(0, 2);
        let html = '';
        popularDishes.forEach(item => {
          let itemImage = '';
          if (item.ImageURL) {
            itemImage = `<img src="data:image/jpeg;base64,${item.ImageURL}" alt="${item.ItemName}" style="display:block;max-width:150px;height:auto;margin:0 auto 10px;">`;
          }
          html += `
            <div class="popular-dish-card">
              ${itemImage}
              <h3 class="popular-dish-name">${item.ItemName}</h3>
              <p class="popular-dish-description">${item.Description || ''}</p>
              <p class="popular-dish-price">${item.Price ? '฿' + item.Price : ''}</p>
            </div>
          `;
        });
        dishesContainer.innerHTML = html;
      } else {
        dishesContainer.innerHTML = "<p>ไม่มีข้อมูล Popular Dishes</p>";
      }
    } catch (error) {
      console.error("Error loading popular dishes:", error);
      document.getElementById('dishes-container').innerHTML = "<p>Error loading popular dishes.</p>";
    }
  }

  async function loadMenuItems(restaurantID) {
    try {
      const response = await fetch(`${API_BASE_URL}/getMenuItems.php?restaurantID=${restaurantID}`);
      const data = await response.json();
      console.log("Menu items:", data);

      const menuList = document.getElementById('menu-list');
      if (data.status === 'success' && data.menuItems.length > 0) {
        let html = '';
        data.menuItems.forEach(item => {
          let itemImage = '';
          if (item.ImageURL) {
            itemImage = `<img src="${item.ImageURL}" alt="${item.ItemName}" class="dish-image">`;
          }
          html += `
            <div class="dish-card">
              ${itemImage}
              <div class="dish-info">
                <h3 class="dish-name">${item.ItemName}</h3>
                <p>${item.Description || ''}</p>
                <p class="dish-price">${item.Price ? '฿' + item.Price : ''}</p>
              </div>
            </div>
          `;
        });
        menuList.innerHTML = html;
      } else {
        menuList.innerHTML = "<p>ไม่มีเมนูอาหาร</p>";
      }
    } catch (error) {
      console.error("Error loading menu items:", error);
      document.getElementById('menu-list').innerHTML = "<p>Error loading menu items.</p>";
    }
  }

  window.onload = loadRestaurantDetails;
</script>
<script src="../api/api.js"></script>
</body>
</html>
